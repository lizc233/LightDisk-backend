server:
  port: 8080

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${star.datasource.host}:${star.datasource.port}/${star.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${star.datasource.username}
    password: ${star.datasource.password}
  redis:
    host: ${star.redis.host}
    port: ${star.redis.port}
    password:
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        max-wait: -1ms
        min-idle: 0

  # 注意：这里给占位符留了默认值。application-dev.yml（已 gitignore）没配 star.rabbitmq 时，
  # 旧写法会让 spring.rabbitmq.port 绑定到字面量 "${star.rabbitmq.port}" → NumberFormatException
  # → 整个 Spring 容器启动失败。默认值保证"没装 RabbitMQ 也能起后端"，只是转码不可用。
  rabbitmq:
    host: ${star.rabbitmq.host:127.0.0.1}
    port: ${star.rabbitmq.port:5672}
    username: ${star.rabbitmq.username:admin}
    password: ${star.rabbitmq.password:123456}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual  # 手动确认，保证消息不丢失
        retry:
          enabled: true
          max-attempts: 3         # 失败重试 3 次
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB

mybatis-plus:
  mapper-locations:
    - classpath:mapper/*.xml
    - classpath:com/star/mapper/*.xml
  type-aliases-package: com.star.model.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      star:
        mapper: debug
        service: info
        controller: info

file:
  upload-dir: E:/lightdisk_data/uploads

lightdisk:
  # ===== 未读数：压测对照开关（默认 false，即走 Redis 缓存）=====
  # 置 true 后 getUnreadCount 强制直接查库，用于「缓存版 vs 查库版」性能对照压测。
  # 可用环境变量 LIGHTDISK_NOTIFICATION_FORCE_DB=true 覆盖，无需改代码。
  notification:
    force-db: false
  mail:
    enabled: false
    from:
  # ===== AI 助手（DeepSeek，OpenAI 兼容）=====
  # api-key 留空 → 自动回落内置规则引擎（离线降级，系统仍可用）
  # 本地建议写在 application-dev.yml（已 gitignore）或用环境变量 DEEPSEEK_API_KEY
  ai:
    enabled: true
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-flash
    timeout-ms: 60000
    temperature: 0.3
    max-tokens: 1500
    # 阶段 4：标准 MCP 工具服务器（Node stdio，官方 @modelcontextprotocol/sdk）
    # enabled=false 或启动失败时自动降级为 Java 本地工具实现
    mcp:
      enabled: true
      command: node
      args:
        - D:/AI_LightDisk/LightDisk/lightdisk-mcp-server/server.js
  notification:
    # 未读数：待落库队列刷盘间隔 / 全量对账间隔（毫秒）
    flush-interval: 2000
    reconcile-interval: 180000

  # ===== 视频转码（FFmpeg → HLS 多清晰度） =====
  transcode:
    enabled: true
    # ffmpeg / ffprobe 可执行文件；留空则尝试从 PATH 查找
    ffmpeg-path: D:/ffmpeg-8.1.2-essentials_build/bin/ffmpeg.exe
    ffprobe-path: D:/ffmpeg-8.1.2-essentials_build/bin/ffprobe.exe
    # HLS 产物目录（相对 file.upload-dir 或绝对路径）
    output-dir: E:/lightdisk_data/uploads/.hls
    # 单文件转码超时（秒）
    timeout-seconds: 3600
    # 最大并发转码任务数（超出排队）
    max-concurrent: 2
    # 源视频短于该秒数则跳过转码，直接原文件播放
    min-duration-seconds: 1
    # HLS 分片时长（秒）
    segment-seconds: 6
