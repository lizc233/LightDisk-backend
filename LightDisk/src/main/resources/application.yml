server:
  port: 8080

spring:
  profiles:
    active: dev # 激活开发环境
  main:
    allow-circular-references: true # 允许循环引用，老项目常见
  datasource:
    # 这里我们不用复杂的变量，直接对接 application-dev.yml 里的私密数据
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${star.datasource.host}:${star.datasource.port}/${star.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: ${star.datasource.username}
    password: ${star.datasource.password}

# MyBatis-Plus 配置 (适配你刚才生成的代码)
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.star.entity
  configuration:
    map-underscore-to-camel-case: true

# 日志配置（改成你的包名 com.star）
logging:
  level:
    com:
      star:
        mapper: debug
        service: info
        controller: info