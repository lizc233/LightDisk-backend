server:
  port: 8080

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${star.datasource.host}:${star.datasource.port}/${star.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${star.datasource.username}
    password: ${star.datasource.password}
  redis:
    host: ${star.redis.host}
    port: ${star.redis.port}
    password:
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        max-wait: -1ms
        min-idle: 0

  rabbitmq:
    host: ${star.rabbitmq.host}
    port: ${star.rabbitmq.port}
    username: ${star.rabbitmq.username}
    password: ${star.rabbitmq.password}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual  # 手动确认，保证消息不丢失
        retry:
          enabled: true
          max-attempts: 3         # 失败重试 3 次
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB

mybatis-plus:
  mapper-locations:
    - classpath:mapper/*.xml
    - classpath:com/star/mapper/*.xml
  type-aliases-package: com.star.model.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      star:
        mapper: debug
        service: info
        controller: info

file:
  upload-dir: E:/lightdisk_data/uploads

lightdisk:
  mail:
    enabled: false
    from:
  # ===== AI 助手（DeepSeek，OpenAI 兼容）=====
  # api-key 留空 → 自动回落内置规则引擎（离线降级，系统仍可用）
  # 本地建议写在 application-dev.yml（已 gitignore）或用环境变量 DEEPSEEK_API_KEY
  ai:
    enabled: true
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-flash
    timeout-ms: 60000
    temperature: 0.3
    max-tokens: 1500
  notification:
    # 未读数：待落库队列刷盘间隔 / 全量对账间隔（毫秒）
    flush-interval: 2000
    reconcile-interval: 180000
