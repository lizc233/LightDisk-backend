server:
  port: 8080

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${star.datasource.host}:${star.datasource.port}/${star.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${star.datasource.username}
    password: ${star.datasource.password}
  redis:
    host: ${star.redis.host}
    port: ${star.redis.port}
    password:
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        max-wait: -1ms
        min-idle: 0
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB

mybatis-plus:
  mapper-locations:
    - classpath:mapper/*.xml
    - classpath:com/star/mapper/*.xml
  type-aliases-package: com.star.model.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      star:
        mapper: debug
        service: info
        controller: info

file:
  upload-dir: E:/lightdisk_data/uploads

lightdisk:
  mail:
    enabled: false
    from:
